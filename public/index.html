<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocking Proxy</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 8px; margin: 5px 0; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Unblocking Proxy</h1>
  <form id="proxyForm">
    <label for="url">Website URL:</label>
    <input type="url" id="url" name="url" placeholder="https://example.com" required>
    
    <label for="js">Custom JavaScript (optional):</label>
    <textarea id="js" name="js" rows="5" placeholder="Enter JavaScript code to inject..."></textarea>
    
    <button type="submit">Load Proxied Page</button>
  </form>
  
  <div id="result">
    <!-- Proxied content will be displayed here -->
  </div>

  <script>
    document.getElementById('proxyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      const js = document.getElementById('js').value;
      
      const proxyUrl = `/proxy?url=${encodeURIComponent(url)}${js ? '&js=' + encodeURIComponent(js) : ''}`;
      
      // For simplicity, open in new window or iframe
      window.open(proxyUrl, '_blank');
    });
  </script>
</body>
</html>
