<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultraviolet Proxy</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { margin-bottom: 20px; }
    input { width: 100%; padding: 8px; margin: 5px 0; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>Ultraviolet Unblocking Proxy</h1>
  <form id="proxyForm">
    <label for="url">Website URL:</label>
    <input type="url" id="url" name="url" placeholder="https://example.com" required>
    <button type="submit">Go</button>
  </form>

  <script>
    // Register the service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/uv/uv.sw.js', { scope: '/service/' })
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.error('Service Worker registration failed', err));
    }

    document.getElementById('proxyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      const encoded = btoa(url).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      window.location.href = `/service/${encoded}`;
    });
  </script>
</body>
</html>
